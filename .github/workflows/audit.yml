name: Scheduled Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils whois curl

      - name: Run checks
        id: checks
        run: |
          set -uo pipefail
          SITE=$(tr -d '[:space:]' < CNAME)
          APEX=${SITE#www.}
          failures=""
          note() { echo "- $1"; failures="${failures}
          - $1"; }

          echo "Auditing $SITE (apex $APEX)"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$SITE" || echo 000)
          if [ "${code#2}" = "$code" ] && [ "${code#3}" = "$code" ]; then
            note "Site https://$SITE returned HTTP $code"
          fi

          if ! echo | openssl s_client -servername "$SITE" -connect "$SITE:443" 2>/dev/null \
               | openssl x509 -noout -checkend 1209600 >/dev/null 2>&1; then
            note "TLS certificate for $SITE is missing or expires within 14 days"
          fi

          if [ -z "$(dig +short MX "$APEX")" ]; then
            note "No MX records for $APEX"
          fi
          if ! dig +short TXT "$APEX" | grep -qi 'v=spf1'; then
            note "No SPF record for $APEX"
          fi
          if ! dig +short TXT "_dmarc.$APEX" | grep -qi 'v=DMARC1'; then
            note "No DMARC record for _dmarc.$APEX"
          fi

          exp=$(whois "$APEX" 2>/dev/null \
                | grep -iE 'expir|expiration date' | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          if [ -n "$exp" ]; then
            days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
            [ "$days" -lt 45 ] && note "Domain $APEX expires in $days days ($exp)"
          fi

          if grep -rqo '{{[A-Z_]*}}' --include='*.html' --include='*.xml' --include='*.txt' .; then
            note "Unrendered {{PLACEHOLDER}} markers found in published files"
          fi

          {
            echo "report<<EOF"
            if [ -n "$failures" ]; then echo "$failures"; else echo "- All checks passed"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$failures" ]; then exit 1; fi
          echo "All checks passed."

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.checks.outputs.report }}
          # Issues open here by default; the default token cannot write to the private
          # company repo. Set AUDIT_ISSUE_REPO plus a PAT to redirect them there.
          TARGET: ${{ vars.AUDIT_ISSUE_REPO }}
        with:
          github-token: ${{ secrets.AUDIT_ISSUE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const [owner, repo] = (process.env.TARGET || `${context.repo.owner}/${context.repo.repo}`).split('/');
            const title = `[audit] Health check failed`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled audit found problems:\n${process.env.REPORT}\n\nRun \`/startup.audit\` locally for detail.\n\n[Workflow run](${runUrl})`;

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'audit'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['audit'] });
            }
